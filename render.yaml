services:
  - type: web
    name: multilingual-transcriber-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: INFO
      - key: OLLAMA_HOST
        value: http://localhost:11434

  - type: web
    name: multilingual-transcriber-frontend
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://multilingual-transcriber-backend.onrender.com
      - key: NODE_VERSION
        value: "20"
